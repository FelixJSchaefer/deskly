workflows:
  deskly-pruefbuild:
    name: Deskly – kostenloser Prüf-Build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: 26.4
    scripts:
      - name: Projekt prüfen und für den iOS-Simulator bauen
        script: |
          set -e
          xcodebuild clean build \
            -project "$CM_BUILD_DIR/Deskly.xcodeproj" \
            -scheme "Deskly" \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/Deskly.app
      - /tmp/xcodebuild_logs/*.log

  deskly-testflight:
    name: Deskly – TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # Später in Codemagic exakt unter diesem Namen anlegen.
      app_store_connect: deskly-app-store
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.deskly.timer
      vars:
        BUNDLE_ID: "com.deskly.timer"
        XCODE_PROJECT: "Deskly.xcodeproj"
        XCODE_SCHEME: "Deskly"
      xcode: 26.4
    scripts:
      - name: Signierung einrichten
        script: xcode-project use-profiles
      - name: Eindeutige Buildnummer setzen
        script: |
          cd "$CM_BUILD_DIR"
          agvtool new-version -all "$PROJECT_BUILD_NUMBER"
      - name: Signierte App erstellen
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
